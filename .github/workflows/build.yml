
name: Build WaseemAssistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP if needed
        shell: bash
        run: |
          if ! find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | grep -q .; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -name 'WaseemAssistant-source.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "Source ZIP is not in the GitHub repository."
              exit 1
            fi
            mkdir -p source
            unzip -o "$ZIP_FILE" -d source
          fi

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found."
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaseemAssistant-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
