name: Build WaseemAssistant APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source ZIP
        run: |
          mkdir source
          unzip -q WaseemAssistant-source.zip -d source

      - name: Build APK
        run: |
          cd source/WaseemAssistant
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaseemAssistant-APK
          path: source/WaseemAssistant/app/build/outputs/apk/debug/*.apk
