
name: Build WaseemAssistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'WaseemAssistant-source.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -o WaseemAssistant-source.zip -d source

      - name: Build Android APK
        run: |
          PROJECT_DIR="$(dirname "$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found in ZIP."
            echo "Check that the ZIP contains the Android project files."
            exit 1
          fi
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaseemAssistant-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
