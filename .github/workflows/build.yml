
name: Build WaseemAssistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Android project
        run: |
          echo "Checking repository contents"
          find . -maxdepth 5 -type f | head -100
          if find . -name settings.gradle -o -name settings.gradle.kts | grep -q .; then
            echo "Android Gradle project found."
          else
            echo "Android Gradle project not found."
            exit 1
          fi
