
name: Build WaseemAssistant APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source ZIP
        run: |
          mkdir source
          unzip -q WaseemAssistant-source.zip -d source

      - name: Fix Java version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("source/WaseemAssistant/app/build.gradle.kts")
          s = p.read_text()

          block = """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""

          pattern = r'compileOptions\s*\{[^}]*\}'

          if re.search(pattern, s, flags=re.S):
              s = re.sub(pattern, block, s, count=1, flags=re.S)
          else:
              s = s.replace("android {", "android {\n    " + block, 1)

          p.write_text(s)
          print("Java version updated to 17")
          PY

      - name: Build APK
        run: |
          cd source/WaseemAssistant
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaseemAssistant-APK
          path: source/WaseemAssistant/app/build/outputs/apk/debug/*.apk
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.waseemassistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.waseemassistant'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
